# GitHub Pages: the same site as on GitLab, built from the reference run committed in
# docs/results/reference (GitHub runners do not run the pipeline on data; GitLab CI does).
# Upload and deploy are separate jobs; the browser check gates deployment.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build the site (numbers from evidence.json and the reference report)
        run: python scripts/build_site.py --out _site --repo-url "https://github.com/${{ github.repository }}" --commit "${GITHUB_SHA::8}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: site
          path: _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  check:
    # 8 devices x light/dark, links and anchors, console and network errors, axe-core WCAG 2.2 AA
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: site
          path: _site
      - run: cd scripts && npm ci --no-audit --no-fund
      - run: node scripts/check_site.js _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, check]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
